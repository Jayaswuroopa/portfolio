<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jayaswuroopa V | Portfolio</title>
    <script>
      // GitHub Pages SPA redirect workaround
      // Encodes the path into a query string so index.html can redirect to it
      var pathSegmentsToKeep = 1; // Number of path segments for the base (e.g., /portfolio/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
